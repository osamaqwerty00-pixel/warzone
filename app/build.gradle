plugins {
    id 'com.android.application'
}

android {
    namespace 'com.warzone.lan'
    compileSdk 34

    defaultConfig {
        applicationId 'com.warzone.lan'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // لا تضغط ملفات اللعبة الكبيرة ولا تتجاهل أي ملف
        noCompress 'js', 'html', 'json'
    }
}
